# This pipeline builds, tests, and deploys an ASP.NET Core application to Azure App Service.

trigger:
- main # Trigger on pushes to the 'main' branch (adjust if you use 'master')

pool:
  vmImage: 'windows-latest' # Use a Microsoft-hosted Windows machine

variables:
  solution: '**/*.sln' # Automatically find your solution file
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  # --- CHECK & UPDATE THESE VARIABLES ---
  # Ensure these project names EXACTLY match your folder/csproj names
  webAppProjectName: 'Gift of The Givers Web App' # Name of your main web project folder/csproj (no extension)
  unitTestProjectName: 'GiftOfGivers' # Name of your UNIT test project folder/csproj (no extension) - UPDATE IF NEEDED
  uiTestProjectName: 'GiftOfGiversUI' # Name of your UI test project folder/csproj (no extension) - UPDATE IF NEEDED
  azureSubscription: '[Your Azure Service Connection Name]' # Name of the Service Connection in Azure DevOps
  webAppName: '[Your Azure App Service Name]' # Name of your Azure App Service instance
  # --- End CHECK & UPDATE ---


stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: BuildJob
    displayName: Build and Test
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '9.x' # Or '8.x' depending on your project's target framework

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: '$(solution)'
        feedsToUse: 'select'

    - task: DotNetCoreCLI@2
      displayName: 'Build solution (Release)'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # Run Unit & Integration Tests
    - task: DotNetCoreCLI@2
      displayName: 'Run Unit & Integration Tests'
      inputs:
        command: 'test'
        projects: '**/$(unitTestProjectName).csproj' # Target your UNIT test project
        arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults_Unit'

    # Playwright Install (Needed for UI Tests) - Runs AFTER build
    # Adjust the path 'GiftOfGiversUI' if your folder name is different
    # Adjust net9.0 if your target framework is different
    - script: |
        cd $(System.DefaultWorkingDirectory)/GiftOfGiversUI
        pwsh bin/$(buildConfiguration)/net9.0/playwright.ps1 install --with-deps
      displayName: 'Install Playwright browsers'
      condition: succeeded() # Only run if build succeeded

    # Run Playwright UI Tests
    - task: DotNetCoreCLI@2
      displayName: 'Run Playwright UI Tests'
      inputs:
        command: 'test'
        projects: '**/$(uiTestProjectName).csproj' # Target your UI test project
        arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults_UI'
      condition: succeeded() # Only run if Playwright install succeeded

    - task: PublishTestResults@2
      displayName: 'Publish Unit/Integration Test Results'
      condition: succeededOrFailed() # Publish results even if tests fail
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/TestResults_Unit/**/*.trx'
        mergeTestResults: true
        failTaskOnFailedTests: false # DO NOT Fail pipeline here, aggregate results later

    - task: PublishTestResults@2
      displayName: 'Publish UI Test Results'
      condition: succeededOrFailed() # Publish results even if tests fail
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/TestResults_UI/**/*.trx'
        mergeTestResults: true
        failTaskOnFailedTests: true # FAIL pipeline if ANY tests (Unit, Integration, or UI) failed

    - task: DotNetCoreCLI@2
      displayName: 'Publish Web App'
      condition: succeeded() # Only publish if all previous steps (including tests) passed
      inputs:
        command: 'publish'
        publishWebProjects: true # Automatically finds web projects
        projects: '**/$(webAppProjectName).csproj' # Explicitly target web project
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/WebApp --no-build'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: drop'
      condition: succeeded()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/WebApp'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded() # Only deploy if Build stage succeeded
  jobs:
  - deployment: DeployWebApp
    displayName: Deploy Web App to Azure
    environment: 'production' # Or your environment name
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppWindows' # Or 'webAppLinux' if applicable
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'
              deploymentMethod: 'auto' # Or 'zipDeploy'

